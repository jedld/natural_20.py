[pytest]
addopts = -p no:launch_testing -p no:launch_testing_ros -p no:launch_testing_ros_pytest_entrypoint
python_files = test_*.py
testpaths = tests
# Vendor code (e.g. CosyVoice/triton_trtllm) ships its own tests requiring
# hardware-specific deps; never collect them in the project suite.
norecursedirs = third_party .conda .nexus htmlcov node_modules
