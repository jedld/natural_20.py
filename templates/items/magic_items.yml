# ----------------------------------------------------------------------------
# Magic Accessories
# ----------------------------------------------------------------------------
amulet_of_health:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Amulet of Health
  flavor_text: A heavy amulet on a thick chain; wearing it steadies the breath and the blood.
  description: >-
    Your Constitution score is 19 while you wear this amulet. It has no effect on you if your Constitution is already 19 or higher. Requires attunement.
  type: accessory
  equippable: true
  weight: 1
  requires_attunement: true
  # Sets minimum CON score to 19 (natural20/utils/item_mechanics.py)
  effect: amulet_of_health
  ability_set:
    con: 19

ring_of_protection:
  cost: 0
  magical: true
  magic_bonus: 1
  name: Ring of Protection
  flavor_text: A plain band that seems to turn just before a blow would land.
  description: You gain a +1 bonus to AC and saving throws while wearing this ring. Requires attunement.
  type: accessory
  equippable: true
  weight: 0.1
  requires_attunement: true
  # +1 to AC and saving throws (AC handled via magic_bonus, saves via effect)
  effect: ring_of_protection

headband_of_intellect:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Headband of Intellect
  flavor_text: A slim circlet that settles on the brow and clears the fog from thought.
  description: >-
    Your Intelligence score is 19 while you wear this headband. It has no effect on you if your Intelligence is already 19 or higher. Requires attunement.
  type: accessory
  equippable: true
  weight: 0.5
  requires_attunement: true
  # Sets minimum INT to 19 (natural20/utils/item_mechanics.py)
  effect: headband_of_intellect
  ability_set:
    int: 19

cloak_of_protection:
  cost: 0
  magical: true
  magic_bonus: 1
  name: Cloak of Protection
  flavor_text: A well-made cloak whose hem never quite catches on thorn or blade.
  description: >-
    You gain a +1 bonus to AC and saving throws while you wear this cloak. Requires attunement.
  type: accessory
  equippable: true
  weight: 1
  requires_attunement: true
  # +1 to AC and saving throws
  effect: cloak_of_protection

gloves_of_thievery:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Gloves of Thievery
  flavor_text: Supple gloves that seem to find the edge of a lock as if they had eyes.
  description: >-
    These gloves are invisible while worn. While wearing them, you gain a bonus to Dexterity (Sleight of Hand) checks and to checks made to pick locks. (SRD 5.2)
