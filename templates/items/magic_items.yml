  flavor_text: A pale lavender ellipsoid that hums faintly whenever magic is near.
  description: >-
    While this stone orbits your head, you can use your reaction to cancel a spell of 4th level or lower that targets
    only you, as long as you can see the caster. The stone can absorb 20 levels of spells before it burns out and turns
    dull grey. (Descriptive only: absorb the spell manually.) Requires attunement.
