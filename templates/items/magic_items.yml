# ----------------------------------------------------------------------------
# Dancing Sword (SRD) — one entry per sword type. ``dancing`` drives the
# bonus-action toss/hover attack (natural20/actions/dancing_weapon_action.py).
# ``proficiency_type`` also lists the base weapon so per-weapon proficiencies
# (e.g. rapier) apply.
# ----------------------------------------------------------------------------
dancing_longsword:
  cost: 0
  damage: 1d8
  damage_2: 1d10
  damage_type: slashing
  magical: true
  rarity: very_rare
  name: Dancing Longsword
  flavor_text: The blade trembles in its scabbard, as if impatient to fight on its own.
  description: >-
    As a bonus action you can toss this sword into the air and speak its command word. It hovers, flies up to 30 feet and
    strikes a creature of your choice within 5 feet of it, using your attack roll and your ability modifier for damage.
    While it hovers you can use a bonus action to send it up to 30 feet to another spot within 30 feet of you and strike
    again. After its fourth strike it flies back to your hand (or drops at your feet if your hands are full). It stops
    hovering if you grab it or move more than 30 feet away from it. Requires attunement.
  proficiency_type:
    - martial
    - longsword
  properties:
    - versatile
  range: 5
  subtype: weapon
  type: melee_attack
  weight: 3
  weapon_mastery:
    - sap
  requires_attunement: true
  dancing:
    attacks: 4
    move_feet: 30
    leash_feet: 30

