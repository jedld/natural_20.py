# ============================================================================
# Magic Items — weapons, armor, shields, and accessories
# ============================================================================
# Each entry may carry:
#   magical: true                # marks the item as magical (bypasses non-magical resistance)
#   magic_bonus: <int>           # flat bonus to attack/damage (weapons) or AC (armor/shields)
#   properties: [...]            # extra D&D properties (e.g. sentient, attunement)
#   requires_attunement: true    # needs attunement to use (natural20/utils/attunement.py)
#   attunement_class/race/alignment: ...  # restricted attunement (string or list)
#   attunement_spellcaster: true # only creatures that cast spells from their own features
#   unattuned: {damage: 1d8}     # overrides used while not attuned (mundane form)
# ============================================================================

