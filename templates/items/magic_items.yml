# ----------------------------------------------------------------------------
# Magic Accessories
# ----------------------------------------------------------------------------
amulet_of_health:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Amulet of Health
  flavor_text: A heavy amulet on a thick chain; wearing it steadies the breath and the blood.
  description: >-
    Your Constitution score is 19 while you wear this amulet. It has no effect on you if your Constitution is already 19 or higher. Requires attunement.
  type: accessory
  equippable: true
  weight: 1
  requires_attunement: true
  # Sets minimum CON score to 19 (handled in code via effect)
  effect: amulet_of_health

ring_of_protection:
  cost: 0
  magical: true
  magic_bonus: 1
  name: Ring of Protection
  flavor_text: A plain band that seems to turn just before a blow would land.
  description: You gain a +1 bonus to AC and saving throws while wearing this ring. Requires attunement.
  type: accessory
  equippable: true
  weight: 0.1
  requires_attunement: true
  # +1 to AC and saving throws (AC handled via magic_bonus, saves via effect)
  effect: ring_of_protection

headband_of_intellect:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Headband of Intellect
  flavor_text: A slim circlet that settles on the brow and clears the fog from thought.
  description: >-
    Your Intelligence score is 19 while you wear this headband. It has no effect on you if your Intelligence is already 19 or higher. Requires attunement.
  type: accessory
  equippable: true
  weight: 0.5
  requires_attunement: true
  # Sets minimum INT to 19
  effect: headband_of_intellect

cloak_of_protection:
  cost: 0
  magical: true
  magic_bonus: 1
  name: Cloak of Protection
  flavor_text: A well-made cloak whose hem never quite catches on thorn or blade.
  description: >-
    You gain a +1 bonus to AC and saving throws while you wear this cloak. Requires attunement.
  type: accessory
  equippable: true
  weight: 1
  requires_attunement: true
  # +1 to AC and saving throws
  effect: cloak_of_protection

gloves_of_thievery:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Gloves of Thievery
  flavor_text: Supple gloves that seem to find the edge of a lock as if they had eyes.
  description: >-
    These gloves are invisible while worn. While wearing them, you gain a bonus to Dexterity (Sleight of Hand) checks and to checks made to pick locks. Requires attunement. (SRD 5.2)
  type: accessory
  equippable: true
  weight: 0.5
  requires_attunement: true
  # Proficiency bonus to Sleight of Hand, Acrobatics, Stealth
  effect: gloves_of_thievery

boots_of_striding_and_springing:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Boots of Striding and Springing
  flavor_text: These boots ignore the weight of armor and drink bad footing like dry earth drinks rain.
  description: >-
    While you wear these boots, your walking speed becomes 30 feet, unless your walking speed is higher, and your speed isn't reduced if you are encumbered or wearing heavy armor. With a 10-foot running start, you can long jump up to 30 feet and high jump up to 15 feet. Requires attunement.
  type: accessory
  equippable: true
  weight: 4
  requires_attunement: true
  effect: boots_of_striding_and_springing

instrument_of_illusions:
  cost: 0
  magical: true
  magic_bonus: 0
  name: Instrument of Illusions
  flavor_text: Notes from this instrument shimmer in the air like heat above a road.
  description: >-
    While you play this instrument, you can weave minor visual illusions into the performance. Requires attunement.
  type: instrument
  equippable: false
  weight: 3
  requires_attunement: true

# ----------------------------------------------------------------------------
# Named Magic Weapons
# ----------------------------------------------------------------------------
flame_tongue_longsword:
  cost: 0
  damage: 1d8+1d6
  damage_type: slashing
  fire_damage: 1d6
  magic_bonus: 2
  magical: true
  name: Flame Tongue
  flavor_text: Command the blade, and fire runs its length like oil catching light.
  description: >-
    You can use a bonus action to speak this magic sword's command word, causing flames to erupt from the blade. These flames shed bright light in a 40-foot radius and dim light for an additional 40 feet. While the sword is ablaze, it deals an extra 2d6 fire damage to any target it hits. Requires attunement.
  proficiency_type:
    - martial
  properties:
    - versatile
  range: 5
  subtype: weapon
  type: melee_attack
  weight: 3
  requires_attunement: true

frost_brand_longsword:
  cost: 0
  damage: 1d8
  damage_type: cold
  magic_bonus: 2
  magical: true
  name: Frost Brand
  flavor_text: Frost feathers the fuller; the steel drinks heat from the air around it.
  description: >-
    When you hit with an attack using this magic sword, the target takes an extra 1d6 cold damage. In addition, while you hold the sword, you have resistance to fire damage. In freezing temperatures, the blade sheds bright light in a 10-foot radius and dim light for an additional 10 feet. Requires attunement.
  proficiency_type:
    - martial
  properties:
    - versatile
  range: 5
  subtype: weapon
  type: melee_attack
  weight: 3
  requires_attunement: true

sun_blade:
  cost: 0
  damage: 1d6
  damage_2: 1d8
  damage_type: radiant
  magic_bonus: 2
  magical: true
  name: Sunblade
  flavor_text: The hilt is real; the blade is a bar of daylight that appears when it is grasped.
  description: >-
    This item appears to be a longsword hilt. While grasping it, you can use a bonus action to cause a blade of pure radiance to spring into existence. The blade emits bright light in a 15-foot radius and dim light for an additional 15 feet. It deals radiant damage and has the finesse property. Requires attunement.
  proficiency_type:
    - martial
  properties:
    - finesse
    - light
    - thrown
  range: 5
  subtype: weapon
  thrown:
    range: 20
    range_max: 60
  type: melee_attack
  weight: 2
  requires_attunement: true
  attunement_class:
    - bard
    - fighter
    - paladin
    - ranger
    - sorcerer
    - warlock
    - wizard

# ----------------------------------------------------------------------------
# Armor with special properties
# ----------------------------------------------------------------------------
dragon_scale_mail:
  ac: 14
  cost: 0
  magic_bonus: 1
  magical: true
  name: Dragon Scale Mail
  flavor_text: Armor of overlapping dragon scales, still faintly warm, still faintly proud.
  description: >-
    Dragon scale mail is made of the scales of one kind of dragon. While wearing it, you gain a +1 bonus to AC, you have advantage on saving throws against the Frightful Presence and breath weapons of dragons, and you have resistance to one damage type determined by the dragon kind. Requires attunement.
  subtype: heavy
  metallic: true
  type: armor
  weight: 50
  requires_attunement: true
  # Resistance to one damage type (chosen on attunement)
  damage_resistance: null

cloak_of_displacement:
  ac: 0
  cost: 0
  magic_bonus: 0
  magical: true
  name: Cloak of Displacement
  flavor_text: The cloak throws your image a step to the side, a shimmering lie that blades chase.
  description: >-
    While you wear this cloak, it projects an illusion that makes you appear to be standing in a place near your actual location, causing attack rolls against you to have disadvantage. If you take damage, the property ceases to function until the start of your next turn. Requires attunement.
  type: armor
  subtype: light
  weight: 1
  requires_attunement: true
  # Gives advantage on AC (attacks have disadvantage)
  effect: cloak_of_displacement
bag_of_holding:
  cost: 0
  magical: true
  name: Bag of Holding
  flavor_text: The mouth of the bag is a dark circle. Reach in, and the bottom is never where it should be.
  type: container
  equippable: true
  weight: 15
  container: true
  extradimensional: true
  capacity_lbs: 500
  capacity_cu_ft: 64
  max_item_size: large
  description: >-
    This bag has an interior space considerably larger than its outside dimensions—roughly 2 feet in diameter at the mouth and 4 feet deep. The bag can hold up to 500 pounds, not exceeding a volume of 64 cubic feet. The bag weighs 15 pounds, regardless of its contents.
bag_of_beans:
  cost: 0
  magical: true
  name: Bag of Beans
  flavor_text: A handful of ordinary-looking beans that are anything but ordinary once they meet earth.
  type: accessory
  equippable: false
  weight: 0.5
  description: A bag containing magical beans with unpredictable narrative effects.
necklace_of_fireballs:
  cost: 0
  magical: true
  name: Necklace of Fireballs
  flavor_text: A golden chain hung with beads like trapped embers, each one a bottled fireball.
  description: >-
    This necklace has 1d6 + 3 beads hanging from it. You can use an action to detach a bead and throw it up to 60 feet. When it reaches the end of its trajectory, the bead detonates as a 3rd-level fireball.
  type: accessory
  equippable: true
  usable: true
  consumable: false
  item_class: MagicSpellItem
  charges: 6
  spell: fireball
  level: 3
  spell_options:
    - spell: fireball
      level: 3
      charges: 1
      label: Throw one bead
  requires_attunement: false
wand_of_magic_missiles:
  cost: 0
  magical: true
  name: Wand of Magic Missiles
  flavor_text: A slender wand that kicks in the hand when it looses darts of force.
  description: >-
    This wand has 7 charges. While holding it, you can use an action to expend 1 or more of its charges to cast magic missile from it. For 1 charge, you cast the 1st-level version; you increase the spell slot by one for each additional charge. The wand regains 1d6 + 1 expended charges daily at dawn.
  type: accessory
  equippable: true
  usable: true
  consumable: false
  item_class: MagicSpellItem
  charges: 7
  spell: magic_missile
  level: 1
  spell_options:
    - spell: magic_missile
      level: 1
      charges: 1
      label: 1 charge
    - spell: magic_missile
      level: 2
      charges: 2
      label: 2 charges
    - spell: magic_missile
      level: 3
      charges: 3
      label: 3 charges
  requires_attunement: false
staff_of_defense:
  cost: 0
  magical: true
  name: Staff of Defense
  flavor_text: A plain wooden staff that grows warm when a spell of warding is near.
  description: >-
    This staff can be wielded as a magic quarterstaff. While holding it, you can expend charges to cast mage armor (1 charge) or shield (2 charges). Requires attunement.
  type: accessory
  equippable: true
  usable: true
  consumable: false
  item_class: MagicSpellItem
  charges: 10
  spell: mage_armor
  level: 1
  spell_options:
    - spell: mage_armor
      level: 1
      charges: 1
      label: Mage Armor
    - spell: shield
      level: 1
      charges: 2
      label: Shield
  requires_attunement: true
