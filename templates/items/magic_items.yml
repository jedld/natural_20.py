  weight: 3
  requires_attunement: true
  unattuned:
    damage: 1d8

frost_brand_longsword:
  cost: 0
  damage: 1d8
  damage_type: cold
  magic_bonus: 2
  magical: true
  name: Frost Brand
  flavor_text: Frost feathers the fuller; the steel drinks heat from the air around it.
  description: >-
    When you hit with an attack using this magic sword, the target takes an extra 1d6 cold damage. In addition, while you hold the sword, you have resistance to fire damage. In freezing temperatures, the blade sheds bright light in a 10-foot radius and dim light for an additional 10 feet. Requires attunement.
  proficiency_type:
    - martial
  properties:
    - versatile
  range: 5
  subtype: weapon
  type: melee_attack
  weight: 3
  requires_attunement: true
  unattuned:
    damage_type: slashing

sun_blade:
  cost: 0
  damage: 1d6
  damage_2: 1d8
  damage_type: radiant
  magic_bonus: 2
  magical: true
  name: Sunblade
  flavor_text: The hilt is real; the blade is a bar of daylight that appears when it is grasped.
  description: >-
    This item appears to be a longsword hilt. While grasping it, you can use a bonus action to cause a blade of pure radiance to spring into existence. The blade emits bright light in a 15-foot radius and dim light for an additional 15 feet. It deals radiant damage and has the finesse property. Requires attunement.
  proficiency_type:
    - martial
  properties:
    - finesse
    - light
    - thrown
  range: 5
  subtype: weapon
  thrown:
    range: 20
    range_max: 60
  type: melee_attack
  weight: 2
  requires_attunement: true
