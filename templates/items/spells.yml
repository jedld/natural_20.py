  label: Ray of Frost
  base_damage: 1d8
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_increase:
    - 5
    - 11
    - 17
  damage_type: cold
  description: |
    A frigid beam of blue-white light streaks toward a creature within range.
