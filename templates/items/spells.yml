---
shield_of_faith:
  label: Shield of Faith
  casting_time: 1:bonus_action
  components:
    - verbal
    - somatic
  description: |
    A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.
  duration: 10m
  level: 1
  name: Shield of Faith
  range: 60
  school: abjuration
  concentration: true
  type: warding
  spell_list_classes:
    - Cleric
  spell_class: Natural20::ShieldOfFaith
divine_smite:
  label: Divine Smite
  casting_time: instant:no_action
  components: []
  damage_type: radiant
  description: |
    Immediately after you hit a creature with a melee weapon attack, you can expend one spell slot to deal radiant damage to the target, in addition to the weapon's damage. The extra damage is 2d8 for a 1st-level slot, plus 1d8 for each spell slot level higher than 1st, to a maximum of 5d8. The damage increases by 1d8 if the target is an undead or a fiend, to a maximum of 6d8.
  duration: instant
  level: 1
  name: Divine Smite
  range: self
  school: evocation
  type: buff
  spell_list_classes:
    - Paladin
  spell_class: Natural20::DivineSmite
booming_blade:
  label: Booming Blade
  casting_time: 1:action
  components:
    - somatic
    - material
  damage_type: thunder
  description: |
    You brandish the weapon used in the spell's casting and make a melee attack with it against one creature within 5 feet of you. On a hit, the target suffers the weapon attack's normal effects and is sheathed in booming energy until the start of your next turn. At higher character levels, the melee attack also deals thunder damage.
  duration: 1 round
  level: 0
  name: Booming Blade
  range: 5
  school: evocation
  type: melee_attack
  spell_list_classes:
    - Sorcerer
    - Warlock
    - Wizard
  spell_class: Natural20::BoomingBlade
spare_the_dying:
  label: Spare the Dying
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs.
  duration: instant
  level: 0
  name: Spare the Dying
  range: 15
  school: necromancy
  type: healing
  spell_list_classes:
    - Cleric
bless:
  casting_time: 1:action
  label: Bless
  components:
    - verbal
    - somatic
  description: |
    You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw.
  duration: 1m
  level: 1
  upcast: true
  name: Bless
  range: 30
  school: enchantment
  type: buff
  concentration: true
  spell_list_classes:
    - Cleric
bane:
  label: Bane
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    Up to three creatures of your choice that you can see within range must make Charisma saving throws. Whenever a target that fails this saving throw makes an attack roll or a saving throw before the spell ends, the target must roll a d4 and subtract the number rolled from the attack roll or saving throw.
  duration: 1m
  level: 1
  upcast: true
  name: Bane
  range: 30
  school: enchantment
  type: debuff
  concentration: true
  spell_list_classes:
    - Cleric
  spell_class: Natural20::Bane
resistance:
  label: Resistance
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends.
  duration: 1m
  level: 0
  name: Resistance
  range: 5
  school: abjuration
  type: buff
  concentration: true
  spell_list_classes:
    - Cleric
    - Druid
  spell_class: Natural20::Resistance
guidance:
  label: Guidance
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one ability check of its choice. The creature can roll the die before or after making the ability check. The spell then ends.
  duration: 1m
  level: 0
  name: Guidance
  range: 5
  school: divination
  type: buff
  concentration: true
  spell_list_classes:
    - Cleric
    - Druid
  spell_class: Natural20::Guidance
burning_hands:
  label: Burning Hands
  casting_time: 1:action
  damage_type: fire
  description: |
    As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a Dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much damage on a successful one.
    The fire ignites any flammable objects in the area that aren't being worn or carried.
  duration: instant
  level: 1
  upcast: true
  name: Burning Hands
  range_cone: 15
  school: evocation
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
  spell_class: Natural20::BurningHands
thunderwave:
  label: Thunderwave
  casting_time: 1:action
  damage_type: thunder
  description: |
    A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you must make a Constitution saving throw. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a successful save, the creature takes half as much damage and isn't pushed.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d8 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  name: Thunderwave
  range_cube: 15
  school: evocation
  type: area
  spell_list_classes:
    - Wizard
    - Sorcerer
    - Druid
  spell_class: Natural20::Thunderwave
hellish_rebuke:
  label: Hellish Rebuke
  casting_time: 1:reaction
  damage_type: fire
  description: |
    You point your finger, and the creature that damaged you is momentarily surrounded by hellish flames. The creature must make a Dexterity saving throw. It takes 2d10 fire damage on a failed save, or half as much damage on a successful one.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st.
  components:
    - verbal
    - somatic
  duration: instant
  level: 1
  upcast: true
  name: Hellish Rebuke
  range: 60
  school: evocation
  type: ranged_attack
  triggers_on_damage: true
  spell_list_classes:
    - Warlock
    - Tiefling
  spell_class: Natural20::HellishRebuke
silvery_barbs:
  label: Silvery Barbs
  casting_time: 1:reaction
  components:
    - verbal
  description: |
    When a creature you can see within 60 feet of you succeeds on an attack roll, an ability check, or a saving throw, you can use your reaction to force that creature to reroll and use the lower result. You can also choose another creature you can see within range; the chosen creature has advantage on the next attack roll, ability check, or saving throw it makes within 1 minute.
  duration: 1m
  level: 1
  name: Silvery Barbs
  range: 60
  school: enchantment
  type: utility
  triggers_on_attack_success: true
  spell_list_classes:
    - Bard
    - Sorcerer
    - Wizard
  spell_class: Natural20::SilveryBarbs
darkness:
  label: Darkness
  casting_time: 1:action
  components:
    - verbal
    - material
  concentration: true
  description: |
    Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. The darkness spreads around corners. A creature with darkvision can't see through this darkness, and nonmagical light can't illuminate it.
    If the point you choose is on an object you are holding or one that isn't being worn or carried, the darkness emanates from the object and moves with it. Completely covering the source of the darkness with an opaque object, such as a bowl or a helm, blocks the darkness.
    If any of this spell's area overlaps with an area of light created by a spell of 2nd level or lower, the spell that created the light is dispelled.
  duration: 10m
  level: 2
  name: Darkness
  radius: 15
  range: 60
  school: evocation
  type: utility
  spell_list_classes:
    - Sorcerer
    - Warlock
    - Wizard
  spell_class: Natural20::Darkness
light:
  label: Light
  casting_time: 1:action
  components:
    - verbal
    - material
  description: |
    You touch one object that is no larger than 10 feet in any dimension. Until the spell ends, the object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. The light can be colored as you like. Completely covering the object with something opaque blocks the light. The spell ends if you cast it again or dismiss it as an action.
    If you target an object held or worn by a hostile creature, that creature must succeed on a Dexterity saving throw to avoid the spell.
  duration: 1h
  level: 0
  name: Light
  range: 5
  bright: 20
  dim: 20
  school: evocation
  type: utility
  color: white
  spell_list_classes:
    - Bard
    - Cleric
    - Sorcerer
    - Wizard
  spell_class: Natural20::Light
ice_knife:
  label: Ice Knife
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_type: piercing
  description: |
    You create a shard of ice and fling it at one creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 piercing damage. Hit or miss, the shard then explodes. The target and each creature within 5 feet of it must succeed on a Dexterity saving throw or take 2d6 cold damage.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the cold damage increases by 1d6 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  name: Ice Knife
  range: 60
  school: conjuration
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
    - Druid
guiding_bolt:
  label: Guiding Bolt
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_type: radiant
  description: |
    A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 4d6 radiant damage, and the next attack roll made against this target before the end of your next turn has advantage, thanks to the mystical dim light glittering on the target until then.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  name: Guiding Bolt
  range: 120
  school: evocation
  type: ranged_attack
  spell_list_classes:
    - Cleric
cure_wounds:
  label: Cure Wounds
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the healing increases by 1d8 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  heal_dice: 1d8
  heal_dice_per_slot: 1d8
  name: Cure Wounds
  range: 5
  school: evocation
  type: healing
  spell_list_classes:
    - Cleric
    - Druid
chill_touch:
  label: Chill Touch
  casting_time: 1:action
  damage_type: necrotic
  description: |
    You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can't regain hit points until the start of your next turn. Until then, the hand clings to the target.
    If you hit an undead target, it also has disadvantage on attack rolls against you until the end of your next turn.
    This spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
  duration: 1R
  level: 0
  name: Chill Touch
  range: 120
  school: necromancy
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
protection_from_poison:
  label: Protection from Poison
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    You touch a creature. If it is poisoned, you neutralize the poison. If more than one poison afflicts the target, you neutralize one poison that you know is present, or you neutralize one at random.
    For the duration, the target has advantage on saving throws against being poisoned, and it has resistance to poison damage.
  duration: 1h
  level: 2
  name: Protection from Poison
  range: touch
  school: abjuration
  type: warding
  spell_list_classes:
    - Cleric
    - Druid
  spell_class: Natural20::ProtectionFromPoison
sacred_flame:
  label: Sacred Flame
  casting_time: 1:action
  damage_type: radiant
  description: |
    Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 radiant damage. The target gains no benefit from cover for this saving throw.
    The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
  duration: instant
  level: 0
  name: Sacred Flame
  range: 60
  school: evocation
  type: ranged_attack
  spell_list_classes:
    - Cleric
toll_the_dead:
  label: Toll the Dead
  casting_time: 1:action
  damage_type: necrotic
  description: |
    You point at one creature you can see within range, and the single chime of a dolorous bell is audible within 10 feet of the target. The target must succeed on a Wisdom saving throw or take 1d8 Necrotic damage. If the target is missing any of its Hit Points, it instead takes 1d12 Necrotic damage.
  duration: instant
  level: 0
  name: Toll the Dead
  range: 60
  school: necromancy
  type: ranged_attack
  spell_list_classes:
    - Cleric
inflict_wounds:
  label: Inflict Wounds
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_type: necrotic
  description: |
    Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  name: Inflict Wounds
  range: 5
  school: necromancy
  type: melee_attack
  spell_list_classes:
    - Cleric
  spell_class: Natural20::InflictWounds
expeditious_retreat:
  label: Expeditious Retreat
  casting_time: 1:bonus_action
  description: |
    This spell allows you to move at an incredible pace. When you cast this spell, and then as a bonus action on each of your turns until the spell ends, you can take the Dash action.
  components:
    - verbal
    - somatic
  duration: 10m
  level: 1
  name: Expeditious Retreat
  range: 0
  school: transmutation
  type: movement
  spell_list_classes:
    - Sorcerer
    - Wizard
find_familiar:
  label: Find Familiar
  casting_time: 1:hour
  components:
    - verbal
    - somatic
    - material
  description: |
    You gain the service of a familiar, a spirit that takes an animal form you choose: bat, cat, crab, frog (toad), hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel.
    Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of a beast.
  level: 1
  materials:
    - charcoal
    - incense
    - herbs
  name: Find Familiar
  range: 10
  school: conjuration
  spell_class: Natural20::FindFamiliar
  type: summoning
  spell_list_classes:
    - Sorcerer
    - Wizard
mage_hand:
  label: Mage Hand
  ai_in_combat: false
  casting_time: 1:action
  components:
    - verbal
    - somatic
  description: |
    A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration or until you dismiss it.
    The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again.
    You can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial.
    As a Magic action on your later turns, you can control the hand again and move it up to 30 feet.
    The hand can’t attack, activate magic items, or carry more than 10 pounds.
  duration: 1m
  level: 0
  name: Mage Hand
  range: 30
  school: conjuration
  spell_class: Natural20::MageHand
  type: utility
  spell_list_classes:
    - Bard
    - Sorcerer
    - Warlock
    - Wizard
firebolt:
  label: Firebolt
  base_damage: 1d10
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_increase:
    - 5
    - 11
    - 17
  damage_type: fire
  description: You hurl a mote of fire at a creature or object within range. A flammable object hit by this spell ignites if it isn't being worn or carried.
  duration: instant
  level: 0
  name: Firebolt
  range: 120
  school: evocation
  spell_class: Natural20::Firebolt
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
armor_of_agathys:
  label: Armor of Agathys
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_type: cold
  description: |
    A protective magical force surrounds you, manifesting as frost that covers you and your gear. You gain 5 temporary hit points for the duration.
    If a creature hits you with a melee attack while you have these hit points, the creature takes 5 cold damage.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, both the temporary hit points and the cold damage increase by 5 for each slot level above 1st.
  duration: 1h
  level: 1
  upcast: true
  name: Armor of Agathys
  range: self
  school: abjuration
  type: warding
  spell_list_classes:
    - Warlock
  spell_class: Natural20::ArmorOfAgathys
eldritch_blast:
  label: Eldritch Blast
  base_damage: 1d10
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_type: force
  description: |
    A beam of crackling energy streaks toward a creature within range. Make a ranged spell attack against the target.
    On a hit, the target takes 1d10 force damage. The spell creates more than one beam when you reach higher levels: two beams at 5th level, three beams at 11th level, and four beams at 17th level.
    You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.
  duration: instant
  level: 0
  name: Eldritch Blast
  range: 120
  school: evocation
  spell_class: Natural20::EldritchBlast
  type: ranged_attack
  spell_list_classes:
    - Warlock
healing_word:
  label: Healing Word
  casting_time: 1:bonus_action
  components:
    - verbal
  description: |
    A creature of your choice that you can see within range regains hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.
    At Higher Levels. When you cast this spell using a spell slot of 2nd level or higher, the healing increases by 1d4 for each slot level above 1st.
  duration: instant
  level: 1
  upcast: true
  heal_dice: 1d4
  heal_dice_per_slot: 1d4
  name: Healing Word
  range: 60
  school: evocation
  type: healing
  spell_list_classes:
    - Cleric
    - Druid
  spell_class: Natural20::HealingWord
mage_armor:
  label: Mage Armor
  casting_time: 1:action
  components:
    - verbal
    - somatic
    - material
  description: You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action.
  duration: 8h
  level: 1
  range: 5
  materials:
    - cured_leather
  name: Mage Armor
  school: abjuration
  spell_class: Natural20::MageArmor
  type: buff
  spell_list_classes:
    - Sorcerer
    - Wizard
magic_missile:
  label: Magic Missile
  casting_time: 1:action
  damage_type: force
  description: You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range.
  level: 1
  upcast: true
  name: Magic Missile
  range: 120
  school: evocation
  spell_class: Natural20::MagicMissile
  type: force
  spell_list_classes:
    - Sorcerer
    - Wizard
misty_step:
  label: Misty Step
  casting_time: 1:bonus_action
  components:
    - verbal
  description: |
    Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space you can see.
  duration: instant
  level: 2
  name: Misty Step
  range: 30
  school: conjuration
  spell_class: Natural20::MistyStep
  type: teleport
