    The spell’s damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
  duration: instant
  level: 0
  name: Ray of Frost
  range: 60
  school: evocation
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
poison_spray:
  label: Poison Spray
  casting_time: 1:action
  damage_type: poison
  description: |
    You extend your hand toward a creature you can see within range and project a puff of noxious gas from your palm. The creature must succeed on a Constitution saving throw or take 1d12 poison damage.
  duration: instant
  level: 0
  components:
    - verbal
    - somatic
  name: Poison Spray
  range: 10
  school: poison
  type: ranged_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
  spell_class: Natural20::PoisonSpray
shield:
  label: Shield
  casting_time: 1:reaction
  description: |
    An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile.
  components:
    - verbal
    - somatic
  duration: 1R
  level: 1
  name: Shield
  range: 0
  school: abjuration
  spell_class: Natural20::Shield
  type: warding
  spell_list_classes:
    - Sorcerer
    - Wizard
shocking_grasp:
  label: Shocking Grasp
  base_damage: 1d8
  casting_time: 1:action
  components:
    - verbal
    - somatic
  damage_increase:
    - 5
    - 11
    - 17
  damage_type: lightning
  description: |
    Lightning springs from your hand to deliver a shock to a creature you try to touch.
    Make a melee spell attack against the target. You have advantage on the attack roll
    if the target is wearing armor made of metal. On a hit, the target takes 1d8 lightning damage,
    and it can’t take reactions until the start of its next turn.

    The spell’s damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).
  duration: instant
  level: 0
  name: Shocking Grasp
  range: 5
  school: evocation
  type: melee_attack
  spell_list_classes:
    - Sorcerer
    - Wizard
sleep:
  label: Sleep
  casting_time: 1:action
  components:
    - verbal
    - somatic
    - material
  material: a pinch of fine sand, rose petals, or a cricket
  description: |
    This spell sends creatures into a magical slumber. Roll 5d8; the total is how many
    hit points of creatures this spell can affect. Creatures within 20 feet of a point
    you choose within range are affected in ascending order of their current hit points
    (ignoring unconscious creatures).

    Starting with the creature that has the lowest current hit points, each creature
    affected by this spell falls unconscious until the spell ends, the sleeper takes
    damage, or someone uses an action to shake or slap the sleeper awake. Subtract each
    creature's hit points from the total before moving on to the creature with the next
    lowest hit points. A creature's hit points must be equal to or less than the
    remaining total for that creature to be affected.

    Undead and creatures immune to being charmed aren't affected by this spell.

    At Higher Levels. When you cast this spell using a spell slot of 2nd level or
    higher, roll an additional 2d8 for each slot level above 1st.
  duration: 1m
  duration_seconds: 60
  level: 1
  upcast: true
  name: Sleep
  range: 90
  radius: 20
  school: enchantment
  type: control
  spell_list_classes:
    - Bard
    - Sorcerer
    - Wizard
  spell_class: Natural20::SleepSpell
spiritual_weapon:
  label: Spiritual Weapon
  casting_time: 1:bonus_action
  level: 2
  duration: 1m
  name: Spiritual Weapon
  range: 60
  school: evocation
  type: summoning
  spell_list_classes:
