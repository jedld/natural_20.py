window_top:
  description: A wall window on the north edge. Opens like a door; glass or shutters; can be barred from inside.
  color: cyan
  damage_threshold: 5
  default_ac: 15
  hp_die: 4d8
  interactable: true
  item_class: WindowObjectWall
  spawner_category: window_walls
  max_hp: 18
  name: Window Top
  hide_map_token: true
  door_pos: 0
  cover_pane: glass
  inside_cover: half
  window_size: medium
  difficult_terrain: true
  window_material: wood
  wall_material: stone
  barred: false
  border:
    - 0
    - 0
    - 0
    - 0
  token:
    - ▭
  token_open:
    - ─
  edit_ui: &window_edit_ui
    label: Window
    scope:
      - legend
      - entity
    groups:
      - id: window
        label: Window
        fields:
          - key: name
            label: Name
            type: string
            help: Optional label for this window in edit mode and on the map.
          - key: state
            label: State
            type: enum
            default: closed
            choices:
              - { value: closed, label: Closed }
              - { value: opened, label: Open }
          - key: cover_pane
            label: Cover
            type: enum
            default: glass
            help: Glass blocks attacks (total cover) but not vision. Opaque shutters match the window material and block both.
            choices:
              - { value: glass, label: Glass (see-through, total cover) }
              - { value: opaque, label: Opaque shutter }
          - key: inside_cover
            label: Inside cover (open)
            type: enum
            default: half
            help: Cover for creatures on the interior side of an open window (PHB half +2 AC / three-quarters +5 AC).
            choices:
              - { value: half, label: Half cover (+2 AC) }
              - { value: three_quarter, label: Three-quarters cover (+5 AC) }
          - key: window_size
            label: Opening size
            type: enum
            default: medium
            help: Smaller openings grant total cover to Tiny (and Small, for slits) creatures. Prone/"crouching" creatures of typical size have total cover behind the sill.
            choices:
              - { value: small, label: Small (slit / high sill) }
              - { value: medium, label: Medium }
              - { value: large, label: Large (low sill) }
          - key: max_pass_size
            label: Largest creature that can pass
            type: enum
            default: any
            help: Creatures larger than this cannot climb through the opening, even when the window is open. Shown on tile mouseover. Independent of opening size (cover).
            choices:
              - { value: any, label: Any size }
              - { value: tiny, label: Tiny }
              - { value: small, label: Small (Medium and larger cannot pass) }
              - { value: medium, label: Medium }
              - { value: large, label: Large }
              - { value: huge, label: Huge }
              - { value: gargantuan, label: Gargantuan }
          - key: barred
            label: Barred from inside
            type: boolean
            default: false
          - key: difficult_terrain
            label: Climbing through is difficult terrain
            type: boolean
            default: true
          - key: window_material
            label: Window material
            type: enum
            default: wood
            help: Frame, shutter, and breakable pane. Stone or iron is harder to smash than wood or glass.
            choices:
              - { value: wood, label: Wood }
              - { value: stone, label: Stone }
              - { value: glass, label: Glass }
              - { value: iron, label: Iron }
          - key: wall_material
            label: Wall material
            type: enum
            default: stone
            help: Material of the surrounding wall (may differ from the window). Used in 3D.
            choices:
              - { value: stone, label: Stone }
              - { value: wood, label: Wood }
              - { value: plaster, label: Plaster }
              - { value: iron, label: Iron }
