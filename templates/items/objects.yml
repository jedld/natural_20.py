window:
  name: Window
  description: An opening in the wall; you can look and fall through to the level below.
  color: cyan
  item_class: Object
  passable: true
  placeable: false
  interactable: false
  peek_through: true
  fall_through: true
  type: window
  token_image: wood_chest
  opaque: false

stairs:
  name: Stairs
  description: >-
    Cosmetic 3D stairs. Invisible and fully passable on the 2D map. Tokens in
    3D follow the step height from the base square to the top.
  color: gray
  item_class: Object
  passable: true
  placeable: true
  interactable: false
  opaque: false
  hide_map_token: true
  spawner_category: terrain
  token:
    - s
  edit_ui:
    label: Stairs
    scope:
      - entity
    groups:
      - id: run
        label: Stair run
        fields:
          - key: squares
            label: Squares (base → top)
            type: point_list
            relative_to: current_map
            required: true
            help: >-
              First square is the base. Click further squares in order toward
              the top, then click the last square again (or Done / Enter).
              A 2-square-wide strip becomes double stairs; a 2×2 block or
              circling ring becomes a spiral. Height is in feet (default 8,
              matching wall height). Use a negative height to go down.
          - key: height
            label: Height (feet)
            type: integer
            default: 8
            help: >-
              Positive rises from the first (base) square to the last.
              Negative descends (for example -8 for an 8-foot drop). Pick
              squares from this floor toward the other end.
          - key: style
            label: Material
            type: enum
            default: ""
            choices:
              - value: ""
                label: Match map walls
              - value: dungeon
                label: Dungeon stone
              - value: mansion
                label: Manor plaster
              - value: gothic
                label: Gothic damask
              - value: wood
                label: Timber
              - value: office
                label: Office drywall
          - key: solid
            label: Solid underside
            type: boolean
            default: true
            help: Fill the volume under the steps so you cannot see through the staircase.
          - key: open_well
            label: Open well
            type: boolean
            default: false
            help: >-
              Spiral only. Leave the center hollow (no newel post) so the
              stairwell is an open shaft.
          - key: wall_attached
            label: Wall-attached
            type: boolean
            default: false
            help: >-
              Spiral only. Extend treads to the well walls and add a square
              enclosure so the run hugs the stairwell.

