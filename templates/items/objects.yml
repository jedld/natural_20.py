    fantasy tavern room service bell pull game icon, brass cord and small rune plate
    on a wooden wall mount, faint magical whisper cantrip glow, warm inn guest room
  buzz_prompt: Ring for Room Service (Message)
  buttons:
    - name: Ring for Room Service
      action: buzz
