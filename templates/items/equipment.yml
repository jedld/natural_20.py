# --- Common SRD / 5e adventuring gear (used by campaigns including Death House) ---
candle:
  cost: 0.01
  name: Candle
  flavor_text: A tallow candle that weeps as it burns.
  description: >-
    For 1 hour, a candle sheds bright light in a 5-foot radius and dim light for an additional 5 feet.
  type: light_source
  weight: 0
  light:
    bright: 5
    dim: 5
oil_flask:
  cost: 0.1
  name: Flask of Oil
  flavor_text: A clay flask of lamp oil, stoppered with waxed cloth.
  description: >-
    Oil usually comes in a clay flask that holds 1 pint. As an action, you can splash the oil onto a creature within 5 feet or throw it up to 20 feet. If lit, the target takes 5 fire damage at the start of its turn for 2 rounds.
  type: gear
  weight: 1
wooden_stake:
  cost: 0.05
  name: Wooden Stake
  flavor_text: A sharpened length of ash, meant for more than a tent line.
  description: A sharpened wooden stake. Harmless to most creatures; vampire-hunters carry several.
  type: gear
  weight: 1
steel_mirror:
  cost: 5
  name: Steel Mirror
  flavor_text: A polished steel plate that serves as a mirror in a pinch.
  description: A polished steel mirror, useful for looking around corners or flashing a signal.
  type: gear
  weight: 0.5
bullseye_lantern:
  cost: 10
  name: Bullseye Lantern
  flavor_text: A hooded lantern that throws a long, narrow cone of light.
  description: >-
    A bullseye lantern casts bright light in a 60-foot cone and dim light for an additional 60 feet. Once lit, it burns for 6 hours on a flask (1 pint) of oil.
  type: light_source
  weight: 2
  light:
    bright: 60
    dim: 60
