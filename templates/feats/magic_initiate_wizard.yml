magic_initiate_wizard:
  name: Magic Initiate (Wizard)
  category: origin
  edition: 5e-2024
  description: |
    You know two wizard cantrips and one level 1 wizard spell, using
    Intelligence, Wisdom or Charisma (your choice) to cast them. The level 1
    spell is always prepared; you can cast it once without a spell slot per
    Long Rest, and with any spell slots you have.

    Sheet: list the chosen spells under `cantrips` / `prepared_spells` and map
    each to its ability in `spell_abilities` (e.g. `{shield: wisdom}`).
  resource_pools:
    magic_initiate_wizard:
      max: 1
      restore_on: long_rest
  free_casts:
    magic_initiate_wizard:
      spell_property: magic_initiate_wizard_spell   # optional sheet override
      spell_source: spell_abilities
      spell_level: 1
      spell_list: wizard
      pool: magic_initiate_wizard
  prerequisites: []
