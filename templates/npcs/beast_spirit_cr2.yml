# Conjure Animals (SRD) CR 2 beast spirit. AC, HP, attack bonus and damage
# are overwritten from the spell level by SummonSpiritSpell. The spirit
# vanishes at 0 HP. Stands in for saber-toothed tigers, giant boars, bears
# and other CR 2 beasts chosen by the summoner.
kind: Beast Spirit (CR 2)
description: A fey spirit shaped like a great beast of the wilds.
