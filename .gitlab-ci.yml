# Replaces GitLab Auto DevOps.
#
# Auto DevOps Build was failing with:
#   invalid tag "/master:<sha>": invalid reference format
# because CI_REGISTRY_IMAGE is empty when Container Registry is disabled.
# See docs/GITLAB_CI.md.
#
# Jobs mirror .github/workflows/python-tests.yml and js-tests.yml.
#
# The n20-webapp and user_levels directories are git submodules pointing at
# GitHub. GitLab CI does NOT fetch them (private on GitHub, no token), so the
# pipeline clones the GitLab mirrors instead:
#
#   jedld/n20-webapp    -> n20-webapp
#   jedld/n20-campaigns -> user_levels
#
# The clone URLs are read from project-level CI/CD variables (masked, protected
# not required):
#
#   N20_WEBAPP_GIT_URL   e.g. https://oauth2:$GITLAB_TOKEN@zariel.local:8090/jedld/n20-webapp.git
#   N20_CAMPAIGNS_GIT_URL e.g. https://oauth2:$GITLAB_TOKEN@zariel.local:8090/jedld/n20-campaigns.git
#
# A project-level access token (Settings -> Access Tokens, scope `read_repository`,
# created for the `jedld` user) works for both mirrors. Do NOT hardcode tokens
# in this file.

stages:
  - test

variables:
  # Disable GitLab's built-in submodule handling entirely; the .clone-mirrors
  # before_script clones the GitLab mirrors directly.
  GIT_SUBMODULE_STRATEGY: none
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTEST_TIMEOUT: "60"

.clone-mirrors:
  interruptible: true
  before_script:
    - |
      set -e
      # The runner container cannot verify the self-hosted GitLab's self-signed
      # TLS certificate, so skip verification for the mirror clones (internal
      # network only).
      export GIT_SSL_NO_VERIFY=true
      # git creates empty placeholder directories for the n20-webapp / user_levels
      # submodule entries even with GIT_SUBMODULE_STRATEGY=none, so remove them
      # before cloning the mirrors into the same paths.
      rm -rf n20-webapp user_levels
      echo "Cloning GitLab mirror: n20-webapp"
      git clone --depth 1 "$N20_WEBAPP_GIT_URL" n20-webapp
      echo "Cloning GitLab mirror: user_levels (n20-campaigns)"
      git clone --depth 1 "$N20_CAMPAIGNS_GIT_URL" user_levels
      # The n20-campaigns repo tracks some campaign assets with Git LFS
      # (e.g. audio). Fetch the real files so tests and assets resolve.
      if command -v git-lfs >/dev/null 2>&1; then
        (cd user_levels && git lfs install --local && git lfs pull) || \
          echo "WARNING: git-lfs pull failed; LFS-tracked files remain pointers"
      else
        echo "WARNING: git-lfs not found in image; LFS-tracked files remain pointers"
      fi

python:engine:
  extends: .clone-mirrors
  stage: test
  image: python:3.11-bookworm
  timeout: 60m
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  variables:
    TEMPLATE_DIR: "$CI_PROJECT_DIR/templates"
  script:
    - python -m pip install --upgrade pip
    - pip install -e .
    - pip install -r requirements.txt
    - pytest tests -q --ignore=tests/webapp --dist=worksteal -n auto

python:webapp:
  extends: .clone-mirrors
  stage: test
  image: python:3.11-bookworm
  timeout: 60m
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  variables:
    TEMPLATE_DIR: "$CI_PROJECT_DIR/templates"
  script:
    - python -m pip install --upgrade pip
    - pip install -e .
    - pip install -e "./n20-webapp[dev]"
    - pytest n20-webapp/tests/webapp -q --dist=worksteal -n auto

js:webapp:
  extends: .clone-mirrors
  stage: test
  image: node:20-bookworm
  timeout: 15m
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - n20-webapp/node_modules
  script:
    - cd n20-webapp
    - npm install --no-audit --no-fund
    - NODE_OPTIONS="--max-old-space-size=4096" npx jest --coverage --forceExit
  artifacts:
    when: always
    paths:
      - n20-webapp/coverage
    expire_in: 7 days
