name: Python Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private submodules
        uses: ./.github/actions/submodule-checkout
        with:
          webapp-key: ${{ secrets.N20_WEBAPP_SSH_KEY }}
          campaigns-key: ${{ secrets.N20_CAMPAIGNS_SSH_KEY }}

      - name: Git LFS (campaign audio)
        run: |
          git lfs install
          git -C user_levels lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run engine tests
        run: pytest tests -q --ignore=tests/webapp --dist=worksteal -n auto --timeout=240 --timeout-method=thread --durations=20
        env:
          PYTEST_TIMEOUT: 60
          TEMPLATE_DIR: ${{ github.workspace }}/templates
          # The suite is wide (~2700 tests, mostly short) and the runner has
          # 4 vCPUs; without this each of the 4 xdist workers spawns a
          # multi-threaded OpenBLAS pool and the threads thrash. Pinning BLAS
          # to one thread per worker cut the wall time ~25% in local testing.
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"

  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private submodules
        uses: ./.github/actions/submodule-checkout
        with:
          webapp-key: ${{ secrets.N20_WEBAPP_SSH_KEY }}
          campaigns-key: ${{ secrets.N20_CAMPAIGNS_SSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "./n20-webapp[dev]"

      - name: Run webapp tests
        run: pytest n20-webapp/tests/webapp -q --dist=worksteal -n 1
        env:
          TEMPLATE_DIR: ${{ github.workspace }}/templates
