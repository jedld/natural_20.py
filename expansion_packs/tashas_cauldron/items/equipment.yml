---
# Alchemist experimental elixirs (Tasha's Cauldron of Everything).
# EffectConsumableItem: natural20/item_library/effect_consumable.py
# creator_riders: Restorative Reagents adds temp HP when the maker has it.
elixir_of_healing:
  name: Experimental Elixir (Healing)
  item_class: EffectConsumableItem
  type: potion
  usable: true
  consumable: true
  activation: action
  weight: 0.5
  cost: 0
  description: The drinker regains 2d4 hit points plus the maker's Intelligence modifier.
  flavor_text: A ruby-red draught that tastes faintly of cinnamon.
  heal: 2d4
  heal_bonus: creator_ability:intelligence
  creator_riders:
  - {feature: restorative_reagents, temp_hp: 2d6, temp_hp_bonus: 'creator_ability:intelligence'}
  icon_prompt: small corked glass vial of glowing red liquid with a white heart sparkle
elixir_of_swiftness:
  name: Experimental Elixir (Swiftness)
  item_class: EffectConsumableItem
  type: potion
  usable: true
  consumable: true
  activation: action
  weight: 0.5
  cost: 0
  description: The drinker's walking speed increases by 10 feet for 1 hour.
  flavor_text: A fizzing blue tonic that makes the legs tingle.
  buffs: {speed_bonus: 10}
  duration_seconds: 3600
  creator_riders:
  - {feature: restorative_reagents, temp_hp: 2d6, temp_hp_bonus: 'creator_ability:intelligence'}
  icon_prompt: small corked glass vial of pale yellow liquid with wind streak lines
