# Optional GPU sidecar — run from services/vllm-omni-tts/
# Requires: NVIDIA Container Toolkit, docker compose v2
services:
  vllm-omni-tts:
    image: vllm/vllm-omni:latest
    ports:
      - "${VLLM_PORT:-8091}:8091"
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    env_file:
      - .env
    command: >
      vllm serve ${VLLM_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      --deploy-config vllm_omni/deploy/qwen3_tts.yaml
      --omni
      --port 8091
      --trust-remote-code
      --enforce-eager
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.35}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface_cache:
